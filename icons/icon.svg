<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f5fe0"/>
      <stop offset="1" stop-color="#14286b"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset=".55" stop-color="#f08a3c"/>
      <stop offset="1" stop-color="#7a3a8c"/>
    </linearGradient>
    <linearGradient id="suit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9e1f0"/>
    </linearGradient>
    <clipPath id="vclip"><ellipse cx="256" cy="228" rx="104" ry="84"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- stars -->
  <g fill="#fff">
    <circle cx="70" cy="80" r="4"/><circle cx="430" cy="66" r="5"/><circle cx="460" cy="190" r="3"/>
    <circle cx="52" cy="220" r="3"/><circle cx="110" cy="140" r="2.5"/><circle cx="400" cy="130" r="2.5"/>
    <path d="M420 300 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z" opacity=".9"/>
    <path d="M86 330 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" opacity=".8"/>
  </g>
  <!-- body / shoulders -->
  <path d="M96 512 C96 410 160 370 256 370 C352 370 416 410 416 512 Z" fill="url(#suit)"/>
  <rect x="206" y="410" width="100" height="62" rx="12" fill="#c9d4ea"/>
  <circle cx="230" cy="440" r="9" fill="#e5484d"/><circle cx="256" cy="440" r="9" fill="#2f5fe0"/><circle cx="282" cy="440" r="9" fill="#30a46c"/>
  <!-- neck ring -->
  <ellipse cx="256" cy="362" rx="98" ry="24" fill="#aebbd6"/>
  <!-- helmet -->
  <circle cx="256" cy="224" r="148" fill="url(#suit)"/>
  <circle cx="256" cy="224" r="148" fill="none" stroke="#c3cee4" stroke-width="6"/>
  <!-- ear pieces -->
  <rect x="96" y="196" width="26" height="70" rx="12" fill="#c9d4ea"/>
  <rect x="390" y="196" width="26" height="70" rx="12" fill="#c9d4ea"/>
  <!-- visor -->
  <ellipse cx="256" cy="228" rx="112" ry="92" fill="#1b2340"/>
  <ellipse cx="256" cy="228" rx="104" ry="84" fill="url(#visor)"/>
  <g clip-path="url(#vclip)">
    <!-- reflection: earth horizon -->
    <circle cx="300" cy="420" r="160" fill="#2f7be0"/>
    <path d="M190 300 q40 -30 80 -10 q30 14 60 -6 q30 -18 60 6 l0 60 -200 0z" fill="#3fbf7f" opacity=".9"/>
  </g>
  <path d="M190 180 q30 -40 86 -44" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round" opacity=".75"/>
  <circle cx="176" cy="212" r="7" fill="#fff" opacity=".75"/>
</svg>
